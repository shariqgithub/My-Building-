<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3" />

  <!-- Sub-meter Dial / Building Graphic -->
  <g filter="url(#glow)">
    <!-- Meter circular frame -->
    <circle cx="256" cy="256" r="150" fill="#022c22" stroke="#10b981" stroke-width="8" stroke-opacity="0.8" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="8 8" />

    <!-- Meter Tick Marks -->
    <circle cx="256" cy="136" r="4" fill="#a7f3d0" />
    <circle cx="376" cy="256" r="4" fill="#a7f3d0" />
    <circle cx="256" cy="376" r="4" fill="#a7f3d0" />
    <circle cx="136" cy="256" r="4" fill="#a7f3d0" />

    <!-- Lightning Bolt Center Symbol -->
    <path d="M268 150 L196 268 L248 268 L240 362 L320 242 L268 242 Z" fill="url(#boltGrad)" stroke="#ca8a04" stroke-width="3" stroke-linejoin="round" />
  </g>

  <!-- Small digital meter display bar at bottom -->
  <rect x="186" y="380" width="140" height="36" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="256" y="405" font-family="monospace, sans-serif" font-size="18" font-weight="bold" fill="#34d399" text-anchor="middle" letter-spacing="3">15 FLATS</text>
</svg>
