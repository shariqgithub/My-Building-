<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Flat Electricity Tracker</title>
    <meta name="theme-color" content="#047857" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 36px 24px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      }
      .icon-box {
        width: 64px;
        height: 64px;
        background: rgba(16, 185, 129, 0.15);
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin: 0 auto 20px auto;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
        color: #f1f5f9;
      }
      p {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: #059669;
        color: white;
        border: none;
        padding: 12px 28px;
        font-size: 14px;
        font-weight: 600;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.2s;
        text-decoration: none;
      }
      .btn:hover {
        background: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-box">⚡</div>
      <h1>App is currently offline</h1>
      <p>The Building Sub-Meter Tracker is working offline. Meter readings and history stored on your device remain accessible.</p>
      <button class="btn" onclick="window.location.reload()">Check Connection</button>
    </div>
  </body>
</html>
